name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      # The webview Karma suite runs in headless Chrome; provision it explicitly so the
      # job does not silently depend on the runner image bundling a browser.
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci
        working-directory: webview-ui

      - name: Lint extension
        run: npm run lint

      - name: Compile extension
        run: npm run compile

      - name: Build webview
        run: npm run build:webview

      - name: Run webview tests
        run: npm run test:ci
        working-directory: webview-ui

      - name: Run extension tests
        run: xvfb-run -a npm test
