<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- This origin's IndexedDB holds the gist token, so no script may run here but the bundle's
         own. The policy lives in the page, not in _headers: that way the dev server, which ignores
         _headers, applies it too, and it stays off the service worker script, where it would
         limit the fetches the worker makes for the page. `frame-ancestors` cannot be set from a
         meta tag and is in _headers.
         - `script-src 'self'` also rules out inline event handlers, which is why the `pwa`
           configuration turns off critical-CSS inlining: it loads the stylesheet with one.
         - `connect-src` is every origin the PWA fetches: the gist API, the raw file URL a
           truncated gist file is read from (GistClient.readFile), and the device-flow proxy
           (environment.pwa.ts). A new one must be added here, or its requests fail in the PWA;
           Karma and the extension webview never load this page, so no test would notice.
         - Images may come from any https host, since todo Markdown can link to one.
         - `form-action 'none'`: the app has no forms, but a diagram's HTML label can still draw
           one, and it could send whatever is typed into it anywhere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://agent-plans-auth-proxy.aiautocoder.workers.dev;
        object-src 'none';
        base-uri 'self';
        form-action 'none'"
    />
    <base href="/" />
    <!-- `interactive-widget=resizes-content` makes the soft keyboard shrink the *layout*
         viewport, so `main`'s `100dvh` recomputes to the space above it and the flex column
         relayouts. Chrome's default (`resizes-visual`) instead keeps the layout viewport at full
         height and pans the *visual* viewport: with nothing on the page scrollable, that pushed
         the header off the top with no way to reach it and left the composer behind the keyboard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32" />
    <!-- Standalone PWA shell. The extension webview uses index.html instead. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS ignores SVG here; without a PNG, Add-to-Home-Screen falls back to a screenshot. -->
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#1f1f1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Plans</title>
  </head>
  <body class="dark">
    <app-pwa-shell></app-pwa-shell>
  </body>
</html>
